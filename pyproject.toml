[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icebreaker"
version = "0.1.0"
description = "Meta-heuristic malware simulation for defensive security research"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
# Phase 2 — uncomment when ready
# phase2 = [
#     "numpy>=1.26",
#     "matplotlib>=3.8",
# ]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
